[workspace]
resolver = "2"
members = [
    "crates/overlay-protocol",
    "crates/overlay-host",
    "crates/overlay-agent-core",
    "crates/overlay-agent-gl",
    "crates/overlay-node",
    "crates/overlay-dotnet-bootstrap",
    "crates/overlay-vulkan-layer",
]

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
license = "MIT"

[workspace.dependencies]
getrandom = "0.4"
libc = "0.2"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
