manifest_version = 1
id = "vosulay"
name = "vosulay"
version = "1.4.0"
description = "In-game overlay host and profile editor for vosu"
author = "18-LAB"
homepage = "https://github.com/shiruviaa/vosulay"
icon = "assets/branding/vosulay-app-icon.svg"
banner = "assets/branding/vosulay-banner.svg"

[ui]
root = "assets/tool"

[service]
command = ["bin/vosulay"]
startup = "always"

[api]
read = ["/v1/view"]
write = ["/v1/manage"]
