[package]
name = "vosulay"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT"
description = "Native Linux in-game overlay manager for vosu"

[dependencies]
anyhow = "1.0"
cxx = "1.0"
directories = "6.0"
scraper = { version = "0.24", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
url = { version = "2.5", features = ["serde"] }

[build-dependencies]
cxx-build = "1.0"
pkg-config = "0.3"
