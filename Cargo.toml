[workspace]
members = ["crates/browser-cef", "crates/cef-tools", "crates/cef-smoke", "crates/frame", "crates/frame-transport", "crates/platform-windows", "crates/platform-linux", "crates/overlay-linux", "crates/overlay-lookup"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "1.1.0"

[package]
name = "vosulay"
version.workspace = true
edition = "2024"
rust-version = "1.96.1"
license = "MIT"
description = "Cross-platform in-game overlay manager for vosu or tosu-compatible backends"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "vosulay"
path = "src/main.rs"
required-features = ["cef-host"]

[features]
default = ["cef-host"]
cef-host = ["dep:vosulay-browser", "dep:vosulay-frame", "dep:vosulay-windows", "dep:vosulay-linux", "dep:vosulay-overlay", "dep:vosulay-lookup", "dep:vosulay-cef-tools", "dep:rfd", "dep:open", "dep:wayland-client", "dep:wayland-protocols-wlr", "dep:x11rb"]

[dependencies]
base64 = "0.22"
anyhow = "1.0"
directories = "6.0"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4"
scraper = { version = "0.24", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
tokio = { version = "=1.53.2", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
url = { version = "2.5", features = ["serde"] }
vosulay-browser = { path = "crates/browser-cef", optional = true }
vosulay-frame = { path = "crates/frame", optional = true }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"], optional = true }
open = { version = "5.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
vosulay-linux = { path = "crates/platform-linux", optional = true }
vosulay-cef-tools = { path = "crates/cef-tools", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
x11rb = { version = "0.14", optional = true }

[target.'cfg(windows)'.dependencies]
vosulay-windows = { path = "crates/platform-windows", optional = true }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Shell"] }

[build-dependencies]
vosulay-cef-tools = { path = "crates/cef-tools" }
tempfile = "3.20"

[target.'cfg(target_os = "linux")'.build-dependencies]
vosulay-overlay = { path = "crates/overlay-linux", optional = true }
vosulay-lookup = { path = "crates/overlay-lookup", optional = true }

# The compositor is retained from a build dependency but runs inside the game.
# Keep host/target profiles identical to avoid colliding cdylib outputs, and do
# not ship Cargo's otherwise unoptimized release build-dependency artifact.
[profile.dev.build-override]
debug = true

[profile.release.build-override]
opt-level = 3
codegen-units = 16
