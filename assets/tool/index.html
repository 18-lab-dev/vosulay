<!doctype html>
<html><head><meta charset="utf-8"><title>vosulay</title><meta name="referrer" content="no-referrer"></head><body><p id="status">Connecting to vosulay…</p><script type="module">
import { vosu } from '/tools/_host/v1/bridge.js';
try {
  await vosu.ready;
  if (window.top !== window.self || window.opener) throw new Error('Open vosulay in a separate tab without an opener');
  const response = await vosu.fetch(vosu.canWrite ? 'v1/manage/document' : `v1/view${location.search}`);
  if (!response.ok) throw new Error(`vosulay returned ${response.status}`);
  const html = await response.text();
  if (vosu.canWrite) window.__VOSULAY_TOOL_FETCH__ = (path, init) => vosu.fetch(path, init);
  window.__VOSULAY_COLOR_SCHEME__ = vosu.colorScheme;
  document.open();
  document.write(html);
  document.close();
} catch (error) {
  const status = document.getElementById('status');
  status.textContent = `This vosulay page is read-only or unavailable: ${error.message}. `;
  const open = document.createElement('button');
  open.textContent = 'Open from vosu';
  open.onclick = async () => {
    try {
      const response = await fetch('/api/dashboard', { cache: 'no-store' });
      if (!response.ok) throw new Error('dashboard unavailable');
      const url = new URL((await response.json()).origin);
      if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password)
        throw new Error('invalid dashboard');
      location.assign(new URL('/tools', url).href);
    } catch (_) {
      status.textContent = 'Open vosu’s Tools page and choose Open for vosulay. ';
      status.append(open);
    }
  };
  status.append(open);
}
</script></body></html>
