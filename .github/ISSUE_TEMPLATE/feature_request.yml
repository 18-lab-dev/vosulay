name: Feature request
description: Suggest a new feature or a change to how vosulay works.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Not sure yet, or want to discuss an idea first? Start in [Ideas](https://github.com/shiruviaa/vosulay/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Windows
        - Linux
        - Both / not platform-specific
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself (see CONTRIBUTING.md).
