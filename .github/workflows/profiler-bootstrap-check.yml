name: Profiler bootstrap check

on:
  push:
    branches:
      - feat/cross-platform-electron-linux-overlay
    paths:
      - ".github/workflows/profiler-bootstrap-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/cross-platform-electron-linux-overlay
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native
      - name: Format check
        working-directory: native
        run: cargo fmt --all --check
      - name: Lint bootstrap
        working-directory: native
        run: cargo clippy -p overlay-dotnet-bootstrap --all-targets -- -D warnings
      - name: Test bootstrap
        working-directory: native
        run: cargo test -p overlay-dotnet-bootstrap
      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/profiler-bootstrap-check.yml
          git add -A
          git config user.name "Sxlvia"
          git config user.email "212748636+qt715@users.noreply.github.com"
          git commit -m "chore(ci): remove profiler bootstrap check"
          git push origin HEAD:feat/cross-platform-electron-linux-overlay
