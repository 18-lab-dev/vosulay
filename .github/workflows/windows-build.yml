name: Windows Build

# Automatic runs are intentionally disabled to preserve GitHub Actions minutes.
# Run this workflow explicitly from the Actions tab when validation is needed.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.96.1

      - name: Acquire CEF, build client, and package portable runtime
        run: cargo run --locked -p vosulay-cef-tools -- package-windows dist/package


      - name: Upload portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vosulay-windows-x86_64
          path: dist/vosulay-*-windows-x86_64.zip
          if-no-files-found: error
