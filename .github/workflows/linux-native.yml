name: Linux Native

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  napi:
    name: N-API addon
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native

      - name: Install addon toolchain
        working-directory: native
        run: npm install --no-audit --no-fund

      - name: Build addon
        working-directory: native
        run: npm run build

      - name: Build fake agent
        working-directory: native
        run: cargo build --release -p overlay-agent-core --bin overlay-fake-agent

      - name: Integration test
        working-directory: native
        env:
          VOSULAY_NATIVE_ADDON: ${{ github.workspace }}/native/crates/overlay-node/overlay-node.linux-x64-gnu.node
          VOSULAY_FAKE_AGENT: ${{ github.workspace }}/native/target/release/overlay-fake-agent
        run: npm test

  gl-harness:
    name: GL harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native

      - name: Install GL toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgbm1 mesa-utils xvfb

      - name: Build agent and SHM host
        working-directory: native
        run: |
          cargo build --release -p overlay-agent-gl
          cargo build --release -p overlay-host --example shm-checkerboard

      - name: Run GL harnesses
        working-directory: native
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          VOSULAY_HARNESS_NO_READBACK: "1"
        run: xvfb-run -a --server-args="-screen 0 1280x720x24" sh test/run-gl-harnesses.sh

  vulkan:
    name: Vulkan layer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native

      - name: Install lavapipe and validation layers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools libvulkan1 vulkan-validationlayers

      - name: Build layer
        working-directory: native
        run: cargo build --release -p overlay-vulkan-layer

      - name: Locate the lavapipe ICD
        id: icd
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
          if [ -z "$icd" ]; then
            echo "no lavapipe ICD found in /usr/share/vulkan/icd.d:" >&2
            ls -1 /usr/share/vulkan/icd.d 2>/dev/null >&2 || true
            exit 1
          fi
          echo "path=$icd" >> "$GITHUB_OUTPUT"

      - name: Verify the layer manifest loads
        working-directory: native
        env:
          VK_ICD_FILENAMES: ${{ steps.icd.outputs.path }}
        run: |
          cp target/release/liboverlay_vulkan_layer.so .
          VK_LAYER_PATH="$PWD" vulkaninfo --summary | tee /tmp/vulkaninfo.txt
          grep -q VK_LAYER_VOSULAY_overlay /tmp/vulkaninfo.txt

      - name: Layer unit tests under validation
        working-directory: native
        env:
          VK_ICD_FILENAMES: ${{ steps.icd.outputs.path }}
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: cargo test -p overlay-vulkan-layer

  package:
    name: Linux package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native

      - name: Install addon toolchain
        working-directory: native
        run: npm install --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --force

      - name: Stage native artifacts
        working-directory: desktop
        run: npm run stage:native

      - name: Build and verify the Linux package
        working-directory: desktop
        run: npm run dist:linux
