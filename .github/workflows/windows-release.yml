name: Windows Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable distributions
        run: npm run dist:win

      - name: Publish release with Windows distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME"
          --verify-tag
          --title "vosulay $env:GITHUB_REF_NAME"
          --generate-notes
          (Get-Item dist/vosulay-*-setup.exe).FullName
          (Get-Item dist/vosulay-*-portable.exe).FullName
