name: Windows Release

# Automatic tag releases are intentionally disabled to preserve GitHub Actions
# minutes. Run this workflow explicitly after creating the intended tag.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable distributions
        run: npm run dist:win

      - name: Publish release with Windows distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME"
          --verify-tag
          --title "vosulay $env:GITHUB_REF_NAME"
          --generate-notes
          (Get-Item dist/vosulay-*-setup.exe).FullName
          (Get-Item dist/vosulay-*-portable.exe).FullName
