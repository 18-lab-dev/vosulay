name: Windows Release

# Automatic tag releases are intentionally disabled to preserve GitHub Actions
# minutes. Run this workflow explicitly after creating the intended tag.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.96.1

      - name: Acquire CEF, build client, and package portable runtime
        run: cargo run --locked -p vosulay-cef-tools -- package-windows dist/package

      - name: Publish release with portable Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq "vosulay" } | Select-Object -First 1 -ExpandProperty version
          $archive = "dist/vosulay-$version-windows-x86_64.zip"
          if (-not (Test-Path $archive)) { throw "Expected package missing: $archive" }
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --title "vosulay $version" --generate-notes $archive
