name: PR2 source patch

on:
  push:
    branches:
      - feat/cross-platform-electron-linux-overlay
    paths:
      - ".github/workflows/pr2-source-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/cross-platform-electron-linux-overlay
          fetch-depth: 0

      - name: Apply source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          node = Path("native/crates/overlay-node/src/lib.rs")
          text = node.read_text()

          old = '''fn parse_u64(value: &str, field: &str) -> Result<u64> {
              let value = value.strip_prefix("0x").unwrap_or(value);
              u64::from_str_radix(value, 16).map_err(|_| fail(format!("invalid {field}")))
          }
          '''
          new = '''fn parse_u64(value: &str, field: &str) -> Result<u64> {
              if let Some(hex) = value
                  .strip_prefix("0x")
                  .or_else(|| value.strip_prefix("0X"))
              {
                  return u64::from_str_radix(hex, 16)
                      .map_err(|_| fail(format!("invalid {field}")));
              }
              // Electron serializes nativePixmap.modifier as a decimal string.
              // Keep an unprefixed-hex fallback for older callers that used the
              // previous convention, but never reinterpret a valid decimal.
              value
                  .parse::<u64>()
                  .or_else(|_| u64::from_str_radix(value, 16))
                  .map_err(|_| fail(format!("invalid {field}")))
          }
          '''
          if old not in text:
              raise SystemExit("parse_u64 anchor missing")
          text = text.replace(old, new, 1)

          old = '''        // Stable/Wine GL zero-copy is opt-in until the direct memory-object
                  // path has been validated against the caller's Chromium native-pixmap
                  // layout. The default remains the correctness-first SHM transport.
                  let expose_dmabuf = std::env::var_os("VOSULAY_GL_DMABUF").is_some();
          '''
          new = '''        // The agent probes the actual presenting context before advertising
                  // DMA-BUF and disconnects/re-attaches on a real import failure, so GL
                  // zero-copy is the default. Keep an explicit escape hatch for driver
                  // debugging or known-bad systems.
                  let expose_dmabuf = std::env::var_os("VOSULAY_GL_SHM_ONLY").is_none();
          '''
          if old not in text:
              raise SystemExit("GL expose_dmabuf anchor missing")
          text = text.replace(old, new, 1)

          old = '''        SessionCommand, Shared, enqueue, prepend_layer_name, prepend_preload, prepend_search_path,
                  remaining,
          '''
          new = '''        SessionCommand, Shared, enqueue, parse_u64, prepend_layer_name, prepend_preload,
                  prepend_search_path, remaining,
          '''
          if old not in text:
              raise SystemExit("test import anchor missing")
          text = text.replace(old, new, 1)

          anchor = '''    #[test]
              fn unrepresentable_preload_paths_are_rejected() {
                  assert!(prepend_preload(Path::new("/app dir/agent.so"), None).is_err());
                  assert!(prepend_preload(Path::new("/app:dir/agent.so"), None).is_err());
              }
          '''
          addition = anchor + '''
              #[test]
              fn electron_modifiers_parse_as_decimal_with_explicit_hex_support() {
                  assert_eq!(
                      parse_u64("72057594037927935", "modifier").unwrap(),
                      0x00ff_ffff_ffff_ffff,
                  );
                  assert_eq!(parse_u64("0x100000000000002", "modifier").unwrap(), 0x100000000000002);
                  assert_eq!(parse_u64("deadbeef", "modifier").unwrap(), 0xdead_beef);
              }
          '''
          if anchor not in text:
              raise SystemExit("modifier test anchor missing")
          text = text.replace(anchor, addition, 1)
          node.write_text(text)

          gl = Path("native/crates/overlay-agent-gl/src/lib.rs")
          text = gl.read_text()

          old = '''fn import_memory_object_surface(
              g: &GlFns,
              memory_fns: GlMemoryObjectFns,
              descriptor: &DmabufDescriptor,
              fd: &OwnedFd,
          ) -> Result<DmabufSurface, ()> {
              let [plane] = descriptor.planes.as_slice() else {
                  return Err(());
              };
              let tight_stride = descriptor.width.checked_mul(4).ok_or(())?;
              // EXT_memory_object_fd has no DRM modifier or row-pitch parameter. Direct
              // import is therefore valid only for a tightly packed linear allocation;
              // other Chromium pixmaps need the GBM staging/blit path before this can be
              // enabled by default.
              if descriptor.modifier != 0
                  || plane.offset != 0
                  || plane.stride != tight_stride
                  || plane.size < u64::from(tight_stride).saturating_mul(u64::from(descriptor.height))
              {
                  return Err(());
              }
              let duplicate = unsafe { libc::fcntl(fd.as_raw_fd(), libc::F_DUPFD_CLOEXEC, 0) };
          '''
          new = '''fn import_memory_object_surface(
              g: &GlFns,
              memory_fns: GlMemoryObjectFns,
              descriptor: &DmabufDescriptor,
              fd: &OwnedFd,
          ) -> Result<DmabufSurface, ()> {
              let [plane] = descriptor.planes.as_slice() else {
                  return Err(());
              };
              // Match the proven MangoHud/idk-overlay GLX path: the PRIME fd is
              // imported as opaque external memory and the driver retains the
              // allocation's native layout. The GL API has no modifier argument,
              // so rejecting a perfectly valid tiled Chromium pixmap merely because
              // its DRM modifier is non-zero prevents the path from ever being tried.
              // Import only the byte range the texture can address; using the full
              // padded allocation size is known to fail on some Mesa drivers.
              let row_bytes = u64::from(plane.stride)
                  .checked_mul(u64::from(descriptor.height))
                  .ok_or(())?;
              let import_size = plane.offset.checked_add(row_bytes).ok_or(())?;
              if import_size == 0 || import_size > plane.size {
                  return Err(());
              }
              let duplicate = unsafe { libc::fcntl(fd.as_raw_fd(), libc::F_DUPFD_CLOEXEC, 0) };
          '''
          if old not in text:
              raise SystemExit("memory object layout anchor missing")
          text = text.replace(old, new, 1)

          old = '''        (memory_fns.import_fd)(
                      memory,
                      plane.size,
                      GL_HANDLE_TYPE_OPAQUE_FD_EXT,
                      owned.into_raw_fd(),
                  );
          '''
          new = '''        (memory_fns.import_fd)(
                      memory,
                      import_size,
                      GL_HANDLE_TYPE_OPAQUE_FD_EXT,
                      owned.into_raw_fd(),
                  );
          '''
          if old not in text:
              raise SystemExit("glImportMemoryFdEXT size anchor missing")
          text = text.replace(old, new, 1)

          old = '''            memory,
                      0,
                  );
          '''
          new = '''            memory,
                      plane.offset,
                  );
          '''
          # This exact pair occurs in the memory-object tex-storage call.
          if old not in text:
              raise SystemExit("glTexStorageMem2DEXT offset anchor missing")
          text = text.replace(old, new, 1)

          helper_anchor = '''fn import_egl_surface(
          '''
          helper = '''fn current_context_uses_egl() -> bool {
              load_egl_dmabuf().is_some_and(|egl| {
                  // SAFETY: queried while the present hook owns the current context.
                  !unsafe { (egl.get_current_display)() }.is_null()
              })
          }

          fn import_egl_surface(
          '''
          if helper_anchor not in text:
              raise SystemExit("EGL helper anchor missing")
          text = text.replace(helper_anchor, helper, 1)

          old = '''        let imported = if !g.is_gles {
                      load_gl_memory_object()
                          .and_then(|memory| import_memory_object_surface(&g, memory, descriptor, fd).ok())
                          .or_else(|| import_egl_surface(&g, descriptor, fds).ok())
                  } else {
                      import_egl_surface(&g, descriptor, fds).ok()
                  };
          '''
          new = '''        let imported = if !g.is_gles {
                      let memory_object = load_gl_memory_object()
                          .and_then(|memory| import_memory_object_surface(&g, memory, descriptor, fd).ok());
                      if memory_object.is_some() {
                          memory_object
                      } else if current_context_uses_egl() {
                          // EGL-created desktop contexts may use EGLImage as a real
                          // fallback. A GLX context must never do so: Wine's GLX path
                          // can accept the bind yet sample black. Failed GLX opaque-fd
                          // import therefore triggers the session's SHM re-attach.
                          import_egl_surface(&g, descriptor, fds).ok()
                      } else {
                          None
                      }
                  } else {
                      import_egl_surface(&g, descriptor, fds).ok()
                  };
          '''
          if old not in text:
              raise SystemExit("draw_dmabuf fallback anchor missing")
          text = text.replace(old, new, 1)
          gl.write_text(text)
          PY

          cargo fmt --manifest-path native/Cargo.toml --all
          rm .github/workflows/pr2-source-patch.yml

          git config user.name "Sxlvia"
          git config user.email "212748636+qt715@users.noreply.github.com"
          git add -A
          git commit -m "feat(native): enable safe GLX DMA-BUF import"
          git push origin HEAD:feat/cross-platform-electron-linux-overlay
