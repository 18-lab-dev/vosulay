name: PR 2 follow-up patch

on:
  push:
    branches:
      - feat/cross-platform-electron-linux-overlay
    paths:
      - ".github/workflows/pr2-followup.yml"
      - ".github/scripts/pr2_followup.py.xz.b64"
  workflow_dispatch:

concurrency:
  group: pr2-followup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: feat/cross-platform-electron-linux-overlay

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native

      - name: Decode and apply the source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import lzma

          encoded = Path(".github/scripts/pr2_followup.py.xz.b64").read_text()
          script = Path(".github/scripts/pr2_followup.py")
          script.write_bytes(lzma.decompress(base64.b64decode(encoded)))
          text = script.read_text()
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)
          '''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new, 1)
              if count == 0 and new and text.count(new) == 1:
                  return text
              raise RuntimeError(f"{label}: expected one old or applied replacement, found {count}")
          '''
          if old not in text:
              raise SystemExit("replace_once helper was not found")
          script.write_text(text.replace(old, new, 1))
          PY
          python .github/scripts/pr2_followup.py
          python - <<'PY'
          from pathlib import Path

          path = Path("native/crates/overlay-agent-gl/src/lib.rs")
          text = path.read_text()
          obsolete = '''fn reject_dmabuf_code(reason: &'static str, code: u32) -> bool {
              if !DMABUF_REJECT_REPORTED.swap(true, Ordering::Relaxed) {
                  agent_diagnostic(&format!("DMA-BUF import rejected: {reason} (0x{code:04x})"));
              }
              withdraw_dmabuf_support();
              false
          }

          '''
          if obsolete not in text:
              raise SystemExit("obsolete reject_dmabuf_code helper was not found")
          path.write_text(text.replace(obsolete, "", 1))
          PY
          rm .github/scripts/pr2_followup.py

      - name: Format Rust changes
        working-directory: native
        run: cargo fmt --all

      - name: Check Rust formatting
        working-directory: native
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        working-directory: native
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        working-directory: native
        run: cargo test --workspace

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --force

      - name: Type-check desktop
        working-directory: desktop
        run: npm run typecheck

      - name: Test desktop
        working-directory: desktop
        run: npm test

      - name: Commit validated source changes
        shell: bash
        run: |
          rm .github/scripts/pr2_followup.py.xz.b64
          rm .github/workflows/pr2-followup.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Patch produced no changes" >&2
            exit 1
          fi
          git config user.name "Sxlvia"
          git config user.email "212748636+qt715@users.noreply.github.com"
          git commit -m "fix(native): harden GPU frame lifetime and DMA-BUF imports"
          git push origin HEAD:feat/cross-platform-electron-linux-overlay
