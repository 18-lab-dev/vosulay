name: PR 2 final validation

on:
  push:
    branches:
      - feat/cross-platform-electron-linux-overlay
    paths:
      - ".github/workflows/pr2-followup.yml"
  workflow_dispatch:

concurrency:
  group: pr2-final-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native

      - name: Check Rust formatting
        working-directory: native
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        working-directory: native
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        working-directory: native
        run: cargo test --workspace

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --force

      - name: Type-check desktop
        working-directory: desktop
        run: npm run typecheck

      - name: Test desktop
        working-directory: desktop
        run: npm test

      - name: Restore normal workflows and remove patch machinery
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          remote_sha=$(git ls-remote origin refs/heads/feat/cross-platform-electron-linux-overlay | cut -f1)
          if [ "$remote_sha" != "$VALIDATED_SHA" ]; then
            echo "The PR branch moved during validation: validated=$VALIDATED_SHA remote=$remote_sha" >&2
            exit 1
          fi

          git checkout b7a79283cb782d91a918a50754a3af572a2d75ec -- \
            .github/workflows/linux-native.yml \
            .github/workflows/windows-build.yml
          rm -f \
            .github/scripts/pr2_followup.py.xz.b64 \
            .github/workflows/pr2-followup.yml \
            .github/workflows/pr2-source-patch.yml

          git add -A
          if git diff --cached --quiet; then
            echo "No validation cleanup changes were produced" >&2
            exit 1
          fi
          git config user.name "Sxlvia"
          git config user.email "212748636+qt715@users.noreply.github.com"
          git commit -m "chore(ci): restore PR validation workflows"
          git push origin HEAD:feat/cross-platform-electron-linux-overlay
