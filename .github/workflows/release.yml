name: Packages

# Manual only, to preserve GitHub Actions minutes. Every run uploads the Linux
# and Windows packages as artifacts. To publish, create the version tag
# (v<Cargo version>), then run this workflow on that tag with "publish" set.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub release from the tag this run uses
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: 2.47.0
  NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
  # The 6.x line built every installer released so far.
  INNO_SETUP_VERSION: 6.7.3
  INNO_SETUP_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732

jobs:
  linux:
    runs-on: ubuntu-latest
    # Built on the oldest supported glibc (2.35) so one binary runs on every
    # target distribution.
    container: ubuntu:22.04
    timeout-minutes: 60
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain and nfpm
        run: |
          sh packaging/linux/install-build-deps.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl -sSfLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | sha256sum -c -
          tar -xzf "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" -C /usr/local/bin nfpm
          rm "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"

      - name: Build Linux packages
        run: packaging/linux/build.sh dist

      - name: Upload Linux packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vosulay-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    # Includes building both asdf-overlay DLLs from source (vosulay-cef build-asdf).
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --target x86_64-pc-windows-msvc
          rustup target add i686-pc-windows-msvc --toolchain 1.96.1
          rustup default 1.96.1

      # Signing stays off until SignPath approves the project and the
      # SIGNPATH_ORGANIZATION_ID variable and SIGNPATH_API_TOKEN secret exist;
      # until then this job builds the same unsigned packages. Only tags are
      # signed. See docs/code-signing.md.
      - name: Select signing
        id: signing
        run: |
          $enabled = '${{ vars.SIGNPATH_ORGANIZATION_ID != '' && startsWith(github.ref, 'refs/tags/v') }}'
          "enabled=$enabled" >> $env:GITHUB_OUTPUT

      - name: Build client DLL
        run: |
          cargo build --release --lib --locked --target x86_64-pc-windows-msvc -p vosulay
          if ($LASTEXITCODE -ne 0) { throw 'Windows client build failed' }
          New-Item -ItemType Directory -Force dist/client | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/vosulay.dll dist/client/

      - name: Upload unsigned client DLL for SignPath
        id: upload-unsigned-client
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-vosulay-client-${{ github.ref_name }}
          path: dist/client/vosulay.dll
          if-no-files-found: error

      # The DLL is signed before packaging: the installer embeds it and the
      # package manifest records its digest.
      - name: Sign client DLL
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: vosulay
          signing-policy-slug: release-signing
          artifact-configuration-slug: client-dll
          github-artifact-id: ${{ steps.upload-unsigned-client.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-client

      - name: Acquire CEF and package ZIP
        run: |
          $client = if ('${{ steps.signing.outputs.enabled }}' -eq 'true') { 'dist/signed-client/vosulay.dll' } else { 'dist/client/vosulay.dll' }
          cargo run --locked -p vosulay-cef-tools -- package-windows dist/package --client $client
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }

      - name: Build installer
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq "vosulay" } | Select-Object -First 1 -ExpandProperty version
          # A pinned compiler, unpacked without installing (no registry or
          # uninstaller), so every release is built by the same Inno Setup.
          $tag = 'is-' + ($env:INNO_SETUP_VERSION -replace '\.', '_')
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_SETUP_VERSION.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_SETUP_VERSION.exe" -OutFile $setup
          if ((Get-FileHash -Algorithm SHA256 $setup).Hash -ne $env:INNO_SETUP_SHA256) {
            throw 'Inno Setup download does not match its pinned SHA-256'
          }
          $inno = Join-Path $env:RUNNER_TEMP 'inno-setup'
          $unpack = Start-Process -Wait -PassThru $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/PORTABLE=1', '/CURRENTUSER', "/DIR=$inno"
          if ($unpack.ExitCode -ne 0) { throw "Inno Setup unpack failed: $($unpack.ExitCode)" }
          $iscc = Join-Path $inno 'ISCC.exe'
          $source = (Resolve-Path 'dist/package').Path
          $output = (New-Item -ItemType Directory -Force 'dist/installer').FullName
          & $iscc "/DAppVersion=$version" "/DSourceDir=$source" "/DOutputDir=$output" 'packaging/windows/vosulay.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }

      - name: Upload unsigned installer for SignPath
        id: upload-unsigned-installer
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-vosulay-installer-${{ github.ref_name }}
          path: dist/installer/vosulay-*-windows-x86_64-setup.exe
          if-no-files-found: error

      - name: Sign installer
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: vosulay
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-installer

      - name: Test signature verification policy
        run: ./packaging/windows/test-verify-release.ps1

      - name: Verify Windows packages
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = '${{ steps.signing.outputs.enabled }}' -eq 'true'
          $directory = if ($signed) { 'dist/signed-installer' } else { 'dist/installer' }
          $installer = Get-ChildItem "$directory/vosulay-*-windows-x86_64-setup.exe" | Select-Object -First 1
          Copy-Item $installer.FullName dist/
          ./packaging/windows/verify-release.ps1 -Package dist/package -Installer $installer.FullName -RequireSignature:$signed

      - name: Upload Windows packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vosulay-windows-x86_64
          path: |
            dist/vosulay-*-windows-x86_64.zip
            dist/vosulay-*-windows-x86_64-setup.exe
          if-no-files-found: error

  release:
    if: inputs.publish
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the final package artifacts: signing also uploads unsigned-*
      # artifacts, and the unsigned installer has the signed one's filename.
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: vosulay-*-x86_64
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::run this workflow on tag v$version (got $GITHUB_REF_NAME)"
            exit 1
          fi
          # Corresponding source for the LGPL components statically linked into
          # the shipped asdf-overlay DLLs; see docs/provenance.md.
          python3 tools/notices/source_bundle.py "dist/vosulay-$version-third-party-sources.tar"
          expected="$(printf '%s\n' \
            "vosulay-$version-1-x86_64.pkg.tar.zst" \
            "vosulay-$version-1.x86_64.rpm" \
            "vosulay-$version-linux-x86_64.tar.gz" \
            "vosulay-$version-third-party-sources.tar" \
            "vosulay-$version-windows-x86_64-setup.exe" \
            "vosulay-$version-windows-x86_64.zip" \
            "vosulay_$version-1_amd64.deb" | sort)"
          actual="$(cd dist && find . -type f -printf '%P\n' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::release assets differ from the expected set"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          (cd dist && sha256sum -- * > SHA256SUMS)
          # --notes prepends this policy without discarding generated release notes.
          # The SignPath attribution appears only when the release was signed.
          policy="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/code-signing.md"
          disclosure="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/security.md"
          if [ "$SIGNED" = true ]; then
            signing='Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).'
          else
            signing='The Windows binaries in this release are not code-signed.'
          fi
          notes="$(printf '## Code signing policy\n\n%s\n\n[Code signing policy](%s) · [Privacy policy](%s#privacy-policy) · [Security and installation disclosure](%s)\n' "$signing" "$policy" "$policy" "$disclosure")"
          # Releases are immutable once published, so create a draft: the
          # maintainer signs and publishes it with tools/release/sign-release.py --publish.
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "vosulay $version" \
            --generate-notes --notes "$notes" dist/*
