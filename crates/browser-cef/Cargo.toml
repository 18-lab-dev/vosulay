[package]
name = "vosulay-browser"
version.workspace = true
edition = "2024"
rust-version = "1.96.1"
license = "MIT"
links = "vosulay_cef"
[[example]]
name = "autoresearch_browser_windows"
path = "examples/autoresearch_browser_windows.rs"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
cef = { version = "=154.5.0", default-features = false, features = ["dox"] }
getrandom = "0.4"
serde_json = "1.0"
url = "2.5"
vosulay-frame = { path = "../frame" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
vosulay-cef-tools = { path = "../cef-tools" }
