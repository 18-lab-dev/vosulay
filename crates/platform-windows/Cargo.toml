[package]
name = "vosulay-windows"
version.workspace = true
edition = "2024"
rust-version = "1.96.1"
license = "MIT"

[dependencies]
anyhow = "1.0"
vosulay-frame = { path = "../frame" }

[target.'cfg(windows)'.dependencies]
asdf-overlay-client = "=2.1.0"
asdf-overlay-event = "=2.1.0"
asdf-overlay-common = "=2.1.0"
asdf-overlay-window-event = "=2.1.0"
png = "0.18.1"
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "sync"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[lib]
path = "src/lib.rs"
