[package]
name = "vosulay-cef-tools"
version.workspace = true
edition = "2024"
rust-version = "1.96.1"
license = "MIT"
description = "Pinned CEF binary acquisition and runtime packaging for vosulay"

[[bin]]
name = "vosulay-cef"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bzip2 = "0.6"
crc32fast = "1.5"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.20"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
