[package]
name = "vosulay-linux"
version.workspace = true
edition = "2024"
rust-version = "1.96.1"
license = "MIT"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1.0"
libc = "0.2"
ksni = { version = "0.3.3", features = ["blocking"] }
vosulay-frame = { path = "../frame" }
vosulay-transport = { path = "../frame-transport" }
